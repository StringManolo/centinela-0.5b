name: Build R2Vul GGUF (Q8_0, Q4_K_M, Q3_K_M & Q2_K)

on:
  workflow_dispatch:
    inputs:
      zenodo_orpo_url:
        description: 'URL directa de orpo.zip en Zenodo (V3: mismo md5 que V2)'
        required: true
        default: 'https://zenodo.org/records/16741648/files/orpo.zip?download=1'
      base_model_id:
        description: 'Modelo base de Hugging Face'
        required: true
        default: 'Qwen/Qwen2.5-Coder-1.5B-Instruct'
      release_tag:
        description: 'Tag para la release de GitHub'
        required: true
        default: 'r2vul-1.5b-gguf-v1'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install merge dependencies (CPU)
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir transformers peft accelerate sentencepiece huggingface_hub

      - name: Download base model from HF
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='${{ github.event.inputs.base_model_id }}', local_dir='./base_model')
          "

      - name: Download R2Vul ORPO adapter from Zenodo
        run: |
          curl -L -o orpo.zip "${{ github.event.inputs.zenodo_orpo_url }}"
          mkdir -p r2vul_adapters
          unzip -q orpo.zip -d r2vul_adapters
          echo "=== adapter_config.json encontrados ==="
          find r2vul_adapters -name 'adapter_config.json' -exec sh -c 'echo "--- $1 ---"; grep base_model_name_or_path "$1"' _ {} \;

      - name: Locate 1.5B adapter
        id: find_adapter
        run: |
          ADAPTER_DIR=""
          for cfg in $(find r2vul_adapters -name 'adapter_config.json'); do
            dir=$(dirname "$cfg")
            if grep -q 'Qwen2.5-Coder-1.5B-Instruct' "$cfg" 2>/dev/null; then
              ADAPTER_DIR="$dir"
              break
            fi
          done
          if [ -z "$ADAPTER_DIR" ]; then
            echo "ERROR: no encontré adapter para Qwen2.5-Coder-1.5B-Instruct"
            exit 1
          fi
          echo "ADAPTER_DIR=$ADAPTER_DIR" >> $GITHUB_OUTPUT
          echo "Adaptador seleccionado: $ADAPTER_DIR"

      - name: Merge adapter with base using peft
        run: |
          cat > merge.py << 'PYEOF'
          import os, torch
          from transformers import AutoModelForCausalLM, AutoTokenizer
          from peft import PeftModel

          adapter_path = os.environ["ADAPTER_DIR"]
          print(f"Base: ./base_model")
          print(f"Adapter: {adapter_path}")

          tokenizer = AutoTokenizer.from_pretrained("./base_model")
          print("Loading base model (bf16)...")
          model = AutoModelForCausalLM.from_pretrained(
              "./base_model",
              torch_dtype=torch.bfloat16,
              device_map="cpu",
          )
          print("Loading adapter...")
          model = PeftModel.from_pretrained(model, adapter_path)
          print("Merging and unloading...")
          model = model.merge_and_unload()
          model.eval()
          print("Saving merged model...")
          model.save_pretrained("./merged_model", safe_serialization=True)
          tokenizer.save_pretrained("./merged_model")
          print("OK - merged model saved to ./merged_model")
          PYEOF
          python merge.py
        env:
          ADAPTER_DIR: ${{ steps.find_adapter.outputs.ADAPTER_DIR }}

      - name: Verify merged model
        run: |
          ls -lah ./merged_model
          echo "=== config.json (head) ==="
          head -20 ./merged_model/config.json

      - name: Clone and build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          cmake -B build -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF
          cmake --build build --config Release -j$(nproc)
          ls -lah build/bin/llama-quantize
          echo "LLAMA_CPP_DIR=$PWD" >> $GITHUB_ENV

      - name: Convert to GGUF F16
        run: |
          cd $LLAMA_CPP_DIR
          pip install --no-cache-dir -r requirements.txt
          mkdir -p ../gguf
          python convert_hf_to_gguf.py ../merged_model \
            --outfile ../gguf/r2vul-1.5b-f16.gguf \
            --outtype f16

      - name: Quantize Q8_0
        run: |
          cd $LLAMA_CPP_DIR
          ./build/bin/llama-quantize ../gguf/r2vul-1.5b-f16.gguf ../gguf/r2vul-1.5b-Q8_0.gguf Q8_0

      - name: Quantize Q4_K_M
        run: |
          cd $LLAMA_CPP_DIR
          ./build/bin/llama-quantize ../gguf/r2vul-1.5b-f16.gguf ../gguf/r2vul-1.5b-Q4_K_M.gguf Q4_K_M

      - name: Quantize Q3_K_M
        run: |
          cd $LLAMA_CPP_DIR
          ./build/bin/llama-quantize ../gguf/r2vul-1.5b-f16.gguf ../gguf/r2vul-1.5b-Q3_K_M.gguf Q3_K_M

      - name: Quantize Q2_K
        run: |
          cd $LLAMA_CPP_DIR
          ./build/bin/llama-quantize ../gguf/r2vul-1.5b-f16.gguf ../gguf/r2vul-1.5b-Q2_K.gguf Q2_K

      - name: List GGUF outputs
        run: ls -lh gguf/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "R2Vul 1.5B GGUF (${{ github.event.inputs.release_tag }})"
          body: |
            R2Vul 1.5B (adaptador ORPO fusionado con Qwen2.5-Coder-1.5B-Instruct).
            - Base: ${{ github.event.inputs.base_model_id }}
            - Fuente adaptador: ${{ github.event.inputs.zenodo_orpo_url }}
            - Q8_0: ~1.6 GB
            - Q4_K_M: ~1.0 GB
            - Q3_K_M: ~0.85 GB
            - Q2_K: ~0.7 GB
          files: |
            gguf/r2vul-1.5b-Q8_0.gguf
            gguf/r2vul-1.5b-Q4_K_M.gguf
            gguf/r2vul-1.5b-Q3_K_M.gguf
            gguf/r2vul-1.5b-Q2_K.gguf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
