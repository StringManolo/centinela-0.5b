name: Fine-tune Centinela

on:
  workflow_dispatch:
    inputs:
      num_epochs:
        description: 'Epochs (default 3)'
        default: '3'
      base_model:
        description: 'HF model ID'
        default: 'dalatexcoder/Qwen2.5-0.5B-Instruct-heretic-test-v2'
      train_file:
        description: 'Train JSONL'
        default: 'data/train_50.jsonl'
      test_file:
        description: 'Test JSONL'
        default: 'data/test_extended.jsonl'
      lr:
        description: 'Learning rate (default 2e-4)'
        default: '2e-4'
      seed:
        description: 'Random seed (default 42)'
        default: '42'
      max_seq_length:
        description: 'Max sequence length (default 1024)'
        default: '1024'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/centinela-train.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-v5
          restore-keys: ${{ runner.os }}-hf-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify tokenization (fail fast)
        env:
          HF_HOME: ~/.cache/huggingface
        run: |
          MAXSEQ="${{ github.event.inputs.max_seq_length }}"; [ -z "$MAXSEQ" ] && MAXSEQ=1024
          MODEL="${{ github.event.inputs.base_model }}"; [ -z "$MODEL" ] && MODEL="dalatexcoder/Qwen2.5-0.5B-Instruct-heretic-test-v2"
          TRAIN="${{ github.event.inputs.train_file }}"; [ -z "$TRAIN" ] && TRAIN="data/train_50.jsonl"
          TEST="${{ github.event.inputs.test_file }}"; [ -z "$TEST" ] && TEST="data/test_extended.jsonl"
          python scripts/verify_tokenization.py --tokenizer "$MODEL" --files "$TRAIN" "$TEST" --max_seq_length "$MAXSEQ"

      - name: Run pipeline
        env:
          HF_HOME: ~/.cache/huggingface
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: |
          EPOCHS="${{ github.event.inputs.num_epochs }}"; [ -z "$EPOCHS" ] && EPOCHS=3
          MODEL="${{ github.event.inputs.base_model }}"; [ -z "$MODEL" ] && MODEL="dalatexcoder/Qwen2.5-0.5B-Instruct-heretic-test-v2"
          TRAIN="${{ github.event.inputs.train_file }}"; [ -z "$TRAIN" ] && TRAIN="data/train_50.jsonl"
          TEST="${{ github.event.inputs.test_file }}"; [ -z "$TEST" ] && TEST="data/test_extended.jsonl"
          LR="${{ github.event.inputs.lr }}"; [ -z "$LR" ] && LR="2e-4"
          SEED="${{ github.event.inputs.seed }}"; [ -z "$SEED" ] && SEED=42
          MAXSEQ="${{ github.event.inputs.max_seq_length }}"; [ -z "$MAXSEQ" ] && MAXSEQ=1024

          python scripts/run_pipeline.py \
            --base_model "$MODEL" \
            --train_file "$TRAIN" \
            --test_file "$TEST" \
            --num_epochs "$EPOCHS" \
            --lr "$LR" \
            --seed "$SEED" \
            --max_seq_length "$MAXSEQ" \
            --output_dir ./lora_adapter

      - uses: actions/upload-artifact@v4
        with:
          name: centinela-run-${{ github.run_id }}
          path: ./lora_adapter/
          if-no-files-found: error
