name: Fine-tune Centinela Security Specialist

# Manual only: a run takes ~1h on the CPU runner, so pushes no longer trigger it.
on:
  workflow_dispatch:
    inputs:
      base_model:
        description: 'HuggingFace model ID'
        required: false
        default: 'huihui-ai/Qwen2.5-0.5B-Instruct-abliterated-v3'
      train_pairs:
        description: 'Training PAIRS to use (empty = all; 10 = 1 per vulnerability type)'
        required: false
        default: ''
      num_epochs:
        description: 'Epochs (ignored if max_steps is set)'
        required: false
        default: '8'
      max_steps:
        description: 'Optimizer steps (empty = use epochs). Use to fix the compute budget across data sizes'
        required: false
        default: ''
      lr:
        description: 'Learning rate'
        required: false
        default: '2e-4'
      seed:
        description: 'Seed (LoRA init, data order, label order)'
        required: false
        default: '42'
      train_templates:
        description: 'Distinct training prompt templates (1-5). Template = pair index within type mod K, so keep K <= pairs per type (10 pairs total => use 1)'
        required: false
        default: '1'
      eval_every:
        description: 'Optimizer steps between evals (empty = every epoch)'
        required: false
        default: ''
      extra_args:
        description: 'Extra pipeline args, e.g. --eval_every 50 --eval_pairs_per_set 10 --train_probe_n 20 --no_shift_eval --permute_labels --score_mode sum'
        required: false
        default: ''
      convert_to_gguf:
        description: 'Merge LoRA and convert to GGUF (slow, ~5-15 min)'
        type: boolean
        required: false
        default: false

jobs:
  fine-tune-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-centinela-v3
          restore-keys: |
            ${{ runner.os }}-hf-centinela-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fine-tuning and evaluation pipeline
        env:
          HF_HOME: ~/.cache/huggingface
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "4"
          IN_BASE_MODEL: ${{ inputs.base_model }}
          IN_TRAIN_PAIRS: ${{ inputs.train_pairs }}
          IN_EPOCHS: ${{ inputs.num_epochs }}
          IN_MAX_STEPS: ${{ inputs.max_steps }}
          IN_LR: ${{ inputs.lr }}
          IN_SEED: ${{ inputs.seed }}
          IN_TEMPLATES: ${{ inputs.train_templates }}
          IN_EVAL_EVERY: ${{ inputs.eval_every }}
          IN_EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          ARGS=(
            --base_model "${IN_BASE_MODEL:-huihui-ai/Qwen2.5-0.5B-Instruct-abliterated-v3}"
            --train_file data/train.jsonl
            --test_file data/test.jsonl
            --output_dir ./lora_adapter
            --num_epochs "${IN_EPOCHS:-8}"
            --lr "${IN_LR:-2e-4}"
            --seed "${IN_SEED:-42}"
            --train_templates "${IN_TEMPLATES:-1}"
          )
          if [ -n "$IN_TRAIN_PAIRS" ]; then ARGS+=(--train_pairs "$IN_TRAIN_PAIRS"); fi
          if [ -n "$IN_MAX_STEPS" ];   then ARGS+=(--max_steps "$IN_MAX_STEPS"); fi
          if [ -n "$IN_EVAL_EVERY" ];  then ARGS+=(--eval_every "$IN_EVAL_EVERY"); fi
          # shellcheck disable=SC2086  # extra_args is intentionally word-split
          python scripts/run_pipeline.py "${ARGS[@]}" $IN_EXTRA_ARGS

      - name: Convert merged model to GGUF
        if: ${{ inputs.convert_to_gguf }}
        run: bash scripts/convert_to_gguf.sh

      - name: Upload LoRA adapter and metrics
        uses: actions/upload-artifact@v4
        with:
          name: centinela-run-${{ github.run_id }}
          path: ./lora_adapter/
          if-no-files-found: error

      - name: Upload GGUF files
        if: ${{ inputs.convert_to_gguf }}
        uses: actions/upload-artifact@v4
        with:
          name: centinela-gguf-${{ github.run_id }}
          path: |
            ./centinela-0.5b-f16.gguf
            ./centinela-0.5b-Q4_K_M.gguf
          if-no-files-found: warn
