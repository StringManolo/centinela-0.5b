name: Centinela - Test trained model

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (centinela-YYYY-MM-DD-RUNID-SIZE-TECHS)'
        required: true
      base_model:
        description: 'Base model'
        required: false
        default: 'huihui-ai/Qwen2.5-0.5B-Instruct-abliterated-v3'
      quant:
        description: 'GGUF a smoke-testear'
        required: false
        default: 'Q4_K_M'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./release ./prev
          gh release download "${{ inputs.release_tag }}" \
            -R "${{ github.repository }}" -D ./release --clobber
          ls -la ./release
          TAG="${{ inputs.release_tag }}"
          cp "./release/${TAG}-lora.safetensors"    ./prev/adapter_model.safetensors
          cp "./release/${TAG}-adapter_config.json" ./prev/adapter_config.json
      - name: Eval-only (real metrics: TYPE, TYPE_SHIFT, DET)
        env:
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_pipeline.py \
            --base_model "${{ inputs.base_model }}" \
            --train_file data/train.jsonl \
            --test_file data/test.jsonl \
            --output_dir ./eval_out \
            --resume_adapter ./prev \
            --eval_only --skip_step0 \
            --rslora --lora_r 32 \
            --lora_targets q_proj,v_proj --lora_dropout 0.05 \
            --lr 1e-4 --seed 42 --train_templates 1 \
            --grad_accum 4 --lr_scheduler constant_with_warmup
      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp ./llama.cpp
          cd ./llama.cpp
          cmake -B build -DLLAMA_CURL=OFF
          cmake --build build --config Release -j4 --target llama-cli
      - name: Smoke test GGUF
        run: |
          python - <<'PY'
          import json, os, subprocess
          tag = "${{ inputs.release_tag }}"
          quant = "${{ inputs.quant }}"
          gguf = f"./release/{tag}-{quant}.gguf"
          assert os.path.isfile(gguf), f"missing {gguf}"
          LABELS = ["XSS","SQLI","CMDI","CODE_INJECTION","PATH_TRAVERSAL",
                    "SSRF","PROTO_POLLUTION","OPEN_REDIRECT","AUTHZ","WEAK_CRYPTO","SAFE"]
          rows = [json.loads(l) for l in open("data/test.jsonl")][:5]
          correct = 0
          for r in rows:
              prompt = ("Analyze the following JavaScript code for security vulnerabilities.\n"
                        f"Answer with exactly one of: {', '.join(LABELS)}.\n\n"
                        f"Code:\n{r['code'][:1200]}")
              out = subprocess.run(
                  ["./llama.cpp/build/bin/llama-cli", "-m", gguf, "-p", prompt,
                   "-n", "4", "--temp", "0", "--no-warmup"],
                  capture_output=True, text=True, timeout=120)
              text = (out.stdout or "")[-300:]
              pred = next((l for l in LABELS if l in text), "?")
              ok = "OK" if pred == r["label"] else "MISS"
              correct += (pred == r["label"])
              print(f"{r['id']:>22}  true={r['label']:<15} pred={pred:<15} {ok}")
          print(f"\nSmoke: {correct}/{len(rows)} aciertos en {quant}")
          PY
      - name: Build report
        if: ${{ always() }}
        run: |
          {
            echo "# Test report — ${{ inputs.release_tag }}"
            echo
            echo "Quant smoke-tested: ${{ inputs.quant }}"
            echo
            echo "## Métricas del adaptador (eval-only, test completo)"
            echo '```'
            python - <<'PY'
          import json, sys
          try:
              m = json.load(open("./eval_out/metrics.json"))
              f = m["curve"][-1]["metrics"]
              for k in ("iid/seen","iid/shift","ood_near/seen","ood_hard/seen"):
                  if k in f:
                      print(f"{k:18s} type={f[k].get('type_acc_forced'):.3f}  "
                            f"shift={f[k].get('type_acc_forced'):.3f}  det={f[k].get('det_auroc'):.3f}")
              c = m["config"]
              print(f"diverged={c.get('diverged')}  steps={c.get('total_steps')}  "
                    f"score_mode={c.get('score_mode_resolved')}")
          except Exception as e:
              print("no metrics:", e)
          PY
            echo '```'
          } > report.md
          cat report.md
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: centinela-test-${{ inputs.release_tag }}
          path: report.md
