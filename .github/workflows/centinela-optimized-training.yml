name: Centinela - Optimized Training (rslora+rank32)

on:
  workflow_dispatch:
    inputs:
      base_model:
        description: 'Base model'
        required: false
        default: 'Qwen/Qwen2.5-Coder-1.5B-Instruct'
      model_size:
        description: 'Tamaño para el nombre de la release'
        required: false
        default: '1.5B'
      techniques:
        description: 'Etiqueta de técnicas para el nombre de la release'
        required: false
        default: 'rslora+rank32'
      all_train_file:
        description: 'Fichero completo (se filtra a nuevos y se selecciona subconjunto)'
        required: false
        default: 'data/train.jsonl'
      num_epochs:
        description: 'Épocas sobre el subconjunto seleccionado'
        required: false
        default: '6'
      time_budget_min:
        description: 'Tope de entrenamiento (min). GH job timeout = 350 min.'
        required: false
        default: '300'
      safety_factor:
        description: 'Fracción del budget a planificar'
        required: false
        default: '0.85'
      sec_per_step:
        description: 'Segundos por paso (0 = auto desde metrics.json previo)'
        required: false
        default: '50'
      lr:
        description: 'Learning rate'
        required: false
        default: '1e-4'
      seed:
        description: 'Semilla (selección + entrenamiento)'
        required: false
        default: '42'
      resume_from:
        description: 'Tag de release, "latest", o vacio (fresh start)'
        required: false
        default: ''
      min_new_rows:
        description: 'Mínimo de filas nuevas para lanzar la run'
        required: false
        default: '2'
      lora_targets:
        description: 'Módulos LoRA (comma-separated). Usa "all-linear" si la arquitectura no tiene q_proj/v_proj.'
        required: false
        default: 'q_proj,v_proj'

permissions:
  contents: write
  actions: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      nothing_new: ${{ steps.filter.outputs.nothing_new }}
      diverged: ${{ steps.posttrain.outputs.diverged }}
      stopped_by_time: ${{ steps.posttrain.outputs.stopped_by_time }}
      new_rows: ${{ steps.filter.outputs.new_rows }}
      deferred_rows: ${{ steps.filter.outputs.deferred_rows }}
      total_rows: ${{ steps.posttrain.outputs.total_rows }}
      sec_per_step: ${{ steps.filter.outputs.sec_per_step }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Compute release tag
        id: meta
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TAG="centinela-${DATE}-${{ github.run_id }}-${{ inputs.model_size }}-${{ inputs.techniques }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-centinela-v3
          restore-keys: |
            ${{ runner.os }}-hf-centinela-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve resume_from
        id: resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_FROM: ${{ inputs.resume_from }}
        run: |
          if [ -z "$RESUME_FROM" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "fresh start"
            exit 0
          fi
          if [ "$RESUME_FROM" != "latest" ]; then
            if ! gh release view "$RESUME_FROM" -R "${{ github.repository }}" >/dev/null 2>&1; then
              echo "::error::release $RESUME_FROM not found"
              exit 1
            fi
            echo "value=$RESUME_FROM" >> "$GITHUB_OUTPUT"
            echo "explicit: $RESUME_FROM"
            exit 0
          fi
          FOUND=""
          for tag in $(gh release list -R "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName'); do
            assets=$(gh release view "$tag" -R "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if echo "$assets" | grep -qx "elegible.txt" \
               && echo "$assets" | grep -q -- "-lora.safetensors" \
               && echo "$assets" | grep -qx "trained.json"; then
              FOUND="$tag"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "no eligible release found -> fresh start"
          else
            echo "value=$FOUND" >> "$GITHUB_OUTPUT"
            echo "latest eligible: $FOUND"
          fi

      - name: Download previous adapter + trained.json + metrics
        if: ${{ steps.resume.outputs.value != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./prev
          gh release download "${{ steps.resume.outputs.value }}" \
            -R "${{ github.repository }}" \
            -p '*-lora.safetensors' \
            -p '*-adapter_config.json' \
            -p 'trained.json' \
            -p '*-metrics.json' \
            -D ./prev --clobber
          LORA=$(ls ./prev/*-lora.safetensors 2>/dev/null | head -1)
          if [ -z "$LORA" ]; then
            echo "::error::no *-lora.safetensors asset in release"
            exit 1
          fi
          mv "$LORA" ./prev/adapter_model.safetensors
          CFG=$(ls ./prev/*-adapter_config.json 2>/dev/null | head -1)
          if [ -z "$CFG" ]; then
            echo "::error::no adapter_config.json in release"
            exit 1
          fi
          mv "$CFG" ./prev/adapter_config.json
          MET=$(ls ./prev/*-metrics.json 2>/dev/null | head -1)
          if [ -n "$MET" ]; then
            mv "$MET" ./prev/metrics.json
          fi
          test -f ./prev/trained.json || { echo "::error::no trained.json in release"; exit 1; }
          ls -la ./prev

      - name: Filter to NEW examples (budget-aware selection)
        id: filter
        run: |
          if [ -n "${{ inputs.sec_per_step }}" ] && [ "${{ inputs.sec_per_step }}" != "0" ]; then
            SEC="${{ inputs.sec_per_step }}"
          elif [ -f ./prev/metrics.json ]; then
            SEC=$(python3 -c "import json; m=json.load(open('./prev/metrics.json')); t=m.get('timings',{}).get('train_s',0); s=m.get('config',{}).get('total_steps',0); print(round(t/s,2) if s else 17)")
          else
            SEC=17
          fi
          echo "sec_per_step=$SEC" >> "$GITHUB_OUTPUT"
          set +e
          python3 scripts/continue_training.py \
            --all_train_file "${{ inputs.all_train_file }}" \
            --trained_file ./prev/trained.json \
            --out ./train_new.jsonl \
            --out_hashes ./new_hashes.json \
            --deferred_file ./deferred.json \
            --time_budget_min "${{ inputs.time_budget_min }}" \
            --num_epochs "${{ inputs.num_epochs }}" \
            --sec_per_step "$SEC" \
            --safety_factor "${{ inputs.safety_factor }}" \
            --select_strategy stratified \
            --seed "${{ inputs.seed }}" \
            --min_new_rows "${{ inputs.min_new_rows }}"
          RC=$?
          set -e
          if [ "$RC" = "78" ]; then
            echo "nothing_new=true" >> "$GITHUB_OUTPUT"
            echo "new_rows=0" >> "$GITHUB_OUTPUT"
            echo "deferred_rows=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No hay ejemplos nuevos suficientes."
          elif [ "$RC" = "0" ]; then
            echo "nothing_new=false" >> "$GITHUB_OUTPUT"
            NEW=$(python3 -c "import json; print(json.load(open('new_hashes.json'))['count'])")
            DEF=0
            if [ -f ./deferred.json ]; then
              DEF=$(python3 -c "import json; print(json.load(open('deferred.json'))['count'])")
            fi
            echo "new_rows=$NEW" >> "$GITHUB_OUTPUT"
            echo "deferred_rows=$DEF" >> "$GITHUB_OUTPUT"
          else
            echo "::error::continue_training.py failed with $RC"
            exit 1
          fi

      - name: Train (rslora+rank32, budget-fitted subset)
        if: ${{ steps.filter.outputs.nothing_new != 'true' }}
        env:
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=(
            --base_model "${{ inputs.base_model }}"
            --train_file ./train_new.jsonl
            --test_file data/test.jsonl
            --output_dir ./lora_adapter
            --num_epochs "${{ inputs.num_epochs }}"
            --time_budget_min "${{ inputs.time_budget_min }}"
            --lr "${{ inputs.lr }}"
            --seed "${{ inputs.seed }}"
            --train_templates 1
            --rslora
            --lora_r 32
            --lora_targets "${{ inputs.lora_targets }}"
            --lora_dropout 0.05
            --lr_scheduler constant_with_warmup
            --grad_accum 4
            --train_probe_n 20
            --skip_step0
            --eval_every 1000000
            --skip_final_eval
          )
          if [ -n "${{ steps.resume.outputs.value }}" ]; then
            ARGS+=(--resume_adapter ./prev)
          fi
          python3 scripts/run_pipeline.py "${ARGS[@]}"

      - name: "Post-training: merge trained.json + write elegible.txt"
        id: posttrain
        if: ${{ steps.filter.outputs.nothing_new != 'true' }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          python3 - <<'PY'
          import json
          prev = set()
          try:
              with open("./prev/trained.json") as f:
                  prev = set(json.load(f).get("hashes", []))
          except FileNotFoundError:
              pass
          with open("./new_hashes.json") as f:
              new = set(json.load(f)["hashes"])
          merged = sorted(prev | new)
          with open("./trained.json", "w") as f:
              json.dump({"hashes": merged, "count": len(merged)}, f)
          print(f"prev={len(prev)} selected_this_run={len(new)} total={len(merged)}")
          PY
          TOTAL=$(python3 -c "import json; print(json.load(open('trained.json'))['count'])")
          echo "total_rows=$TOTAL" >> "$GITHUB_OUTPUT"
          DIVERGED=$(python3 -c "import json; m=json.load(open('./lora_adapter/metrics.json')); print(m['config'].get('diverged', False))")
          STOPPED=$(python3 -c "import json; m=json.load(open('./lora_adapter/metrics.json')); print(bool(m['config'].get('stopped_by_time_budget')))")
          echo "diverged=$DIVERGED" >> "$GITHUB_OUTPUT"
          echo "stopped_by_time=$STOPPED" >> "$GITHUB_OUTPUT"
          if [ "$DIVERGED" = "True" ]; then
            echo "::warning::Training diverged; elegible.txt will NOT be created."
            exit 0
          fi
          echo "tag: $TAG" > elegible.txt
          echo "run_id: ${{ github.run_id }}" >> elegible.txt
          echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> elegible.txt
          echo "base_model: ${{ inputs.base_model }}" >> elegible.txt
          echo "techniques: rslora+rank32" >> elegible.txt
          echo "num_epochs: ${{ inputs.num_epochs }}" >> elegible.txt
          echo "time_budget_min: ${{ inputs.time_budget_min }}" >> elegible.txt
          echo "safety_factor: ${{ inputs.safety_factor }}" >> elegible.txt
          echo "sec_per_step: ${{ steps.filter.outputs.sec_per_step }}" >> elegible.txt
          echo "resumed_from: ${{ steps.resume.outputs.value }}" >> elegible.txt
          echo "new_rows_selected_this_run: ${{ steps.filter.outputs.new_rows }}" >> elegible.txt
          echo "deferred_rows_remaining: ${{ steps.filter.outputs.deferred_rows }}" >> elegible.txt
          echo "total_rows_trained: $TOTAL" >> elegible.txt
          echo "diverged: false" >> elegible.txt
          echo "stopped_by_time_budget: $STOPPED" >> elegible.txt
          cat elegible.txt

      - name: Upload LoRA adapter + registry
        if: ${{ steps.filter.outputs.nothing_new != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: centinela-lora-${{ steps.meta.outputs.tag }}
          path: |
            lora_adapter/adapter_model.safetensors
            lora_adapter/adapter_config.json
            lora_adapter/metrics.json
            lora_adapter/curve.csv
            lora_adapter/scores_final.jsonl
            trained.json
            deferred.json
            elegible.txt
          if-no-files-found: error

  quantize:
    needs: train
    if: ${{ needs.train.outputs.nothing_new != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: centinela-lora-${{ needs.train.outputs.tag }}
          path: ./downloaded

      - name: Merge LoRA into base
        run: |
          if [ -f ./downloaded/lora_adapter/adapter_config.json ]; then
            ADAPTER_DIR=./downloaded/lora_adapter
          elif [ -f ./downloaded/adapter_config.json ]; then
            ADAPTER_DIR=./downloaded
          else
            echo "::error::no adapter_config.json in artifact"
            find ./downloaded -type f
            exit 1
          fi
          echo "adapter dir: $ADAPTER_DIR"
          ADAPTER_DIR="$ADAPTER_DIR" python3 - <<'PY'
          import os, torch
          from peft import PeftModel
          from transformers import AutoModelForCausalLM, AutoTokenizer
          base = "${{ inputs.base_model }}"
          adapter_dir = os.environ["ADAPTER_DIR"]
          model = AutoModelForCausalLM.from_pretrained(base, torch_dtype=torch.float32, trust_remote_code=True)
          model = PeftModel.from_pretrained(model, adapter_dir, is_trainable=False)
          merged = model.merge_and_unload()
          merged.save_pretrained("./merged", safe_serialization=True)
          AutoTokenizer.from_pretrained(base, trust_remote_code=True).save_pretrained("./merged")
          print("merged OK")
          PY

      - name: Build llama.cpp (convert + quantize)
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp ./llama.cpp
          cd ./llama.cpp
          pip install -r requirements.txt
          cmake -B build -DLLAMA_CURL=OFF
          cmake --build build --config Release -j4 --target llama-quantize

      - name: Convert to F32 and F16
        run: |
          python3 ./llama.cpp/convert_hf_to_gguf.py ./merged --outfile ./centinela-F32.gguf --outtype f32
          python3 ./llama.cpp/convert_hf_to_gguf.py ./merged --outfile ./centinela-F16.gguf --outtype f16

      - name: Quantize (Q8_0, Q6_K, Q4_K_M, Q3_K_M, Q2_K)
        run: |
          for Q in Q8_0 Q6_K Q4_K_M Q3_K_M Q2_K; do
            echo "== $Q =="
            ./llama.cpp/build/bin/llama-quantize ./centinela-F16.gguf "./centinela-${Q}.gguf" "$Q"
          done

      - name: Rename with full tag
        run: |
          TAG="${{ needs.train.outputs.tag }}"
          for q in F32 F16 Q8_0 Q6_K Q4_K_M Q3_K_M Q2_K; do
            mv "centinela-${q}.gguf" "${TAG}-${q}.gguf"
          done
          ls -la *.gguf

      - name: Upload GGUFs
        uses: actions/upload-artifact@v4
        with:
          name: centinela-gguf-${{ needs.train.outputs.tag }}
          path: '*.gguf'
          if-no-files-found: error

  release:
    needs: [train, quantize]
    if: ${{ needs.train.outputs.nothing_new != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: centinela-lora-${{ needs.train.outputs.tag }}
          path: ./downloaded

      - uses: actions/download-artifact@v4
        with:
          name: centinela-gguf-${{ needs.train.outputs.tag }}
          path: ./gguf

      - name: Rename assets with tag (skip F32/F16: exceed GitHub 2 GB release-asset limit)
        run: |
          TAG="${{ needs.train.outputs.tag }}"
          mkdir -p ./release
          for q in Q8_0 Q6_K Q4_K_M Q3_K_M Q2_K; do
            cp "./gguf/${TAG}-${q}.gguf" "./release/${TAG}-${q}.gguf"
          done
          if [ -f ./downloaded/lora_adapter/adapter_config.json ]; then
            BASE=./downloaded/lora_adapter
          elif [ -f ./downloaded/adapter_config.json ]; then
            BASE=./downloaded
          else
            echo "::error::no adapter_config.json in artifact"
            find ./downloaded -type f
            exit 1
          fi
          echo "base dir: $BASE"
          cp "$BASE/adapter_model.safetensors" "./release/${TAG}-lora.safetensors"
          cp "$BASE/adapter_config.json" "./release/${TAG}-adapter_config.json"
          cp "$BASE/metrics.json" "./release/${TAG}-metrics.json"
          for f in trained.json deferred.json elegible.txt; do
            if [ -f "./downloaded/$f" ]; then
              cp "./downloaded/$f" "./release/$f"
            elif [ -f "./downloaded/lora_adapter/$f" ]; then
              cp "./downloaded/lora_adapter/$f" "./release/$f"
            fi
          done
          ls -la ./release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.train.outputs.tag }}
          name: ${{ needs.train.outputs.tag }}
          body: |
            Run `${{ github.run_id }}`
            - Techniques: `rslora+rank32`
            - Rows selected this run: `${{ needs.train.outputs.new_rows }}`
            - Rows deferred to next run: `${{ needs.train.outputs.deferred_rows }}`
            - Total rows trained (cumulative): `${{ needs.train.outputs.total_rows }}`
            - Resumed from: `${{ steps.resume.outputs.value || 'fresh start' }}`
            - Diverged: `${{ needs.train.outputs.diverged }}` — Stopped by time: `${{ needs.train.outputs.stopped_by_time }}`
            - Quantizations: Q8_0, Q6_K, Q4_K_M, Q3_K_M, Q2_K (F32/F16 superan el límite de 2 GB por asset de GitHub; disponibles como workflow artifacts del run)
            - LoRA tensors: `${{ needs.train.outputs.tag }}-lora.safetensors`
          files: |
            ./release/*.gguf
            ./release/*-lora.safetensors
            ./release/*-adapter_config.json
            ./release/*-metrics.json
            ./release/trained.json
            ./release/deferred.json
            ./release/elegible.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-test:
    needs: [train, release]
    if: ${{ needs.train.outputs.nothing_new != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch test workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run centinela-optimized-test.yml \
            -R "${{ github.repository }}" \
            -f release_tag="${{ needs.train.outputs.tag }}" \
            -f base_model="${{ inputs.base_model }}"
          echo "Dispatched centinela-optimized-test.yml for ${{ needs.train.outputs.tag }}"
