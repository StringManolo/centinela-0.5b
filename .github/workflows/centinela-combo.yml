name: Centinela - combinaciones de las mejores tecnicas

# plan   -> every subset of the technique pool (default 5 techniques = 31 combinations + baseline) plus
#           extra baseline seeds and reference techniques that cannot be combined (ia3)
# run    -> every cell in parallel (20 at a time on a free account), training capped at 42 min, job at 75 min
# report -> compares combinations with the single techniques and analyses main effects and interactions
#
# Default: 36 jobs (about 36 x 35 min of runner time). Two waves on a free account (20 concurrent jobs).
on:
  workflow_dispatch:
    inputs:
      base_model:
        description: 'Base model'
        required: false
        default: 'huihui-ai/Qwen2.5-0.5B-Instruct-abliterated-v3'
      pool:
        description: 'Techniques to combine (comma list, all must be LoRA-compatible)'
        required: false
        default: 'lora_plus,targets_all,lr3e4,rslora,rank32'
      refs:
        description: 'Reference techniques measured alone (cannot be combined)'
        required: false
        default: 'ia3'
      seed:
        description: 'Seed shared by every combination cell (use one NOT used in earlier comparisons: 42,7,123,11,99)'
        required: false
        default: '2024'
      baseline_seeds:
        description: 'Baseline seeds (their spread is the noise level)'
        required: false
        default: '2024,2025,2026,2027'
      max_steps:
        description: 'Optimizer steps per run (same budget as the earlier comparison)'
        required: false
        default: '150'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preflight (required files and versions)
        run: |
          ok=1
          for f in scripts/run_pipeline.py scripts/oat.py scripts/combo.py data/train.jsonl data/test.jsonl requirements.txt; do
            if [ ! -f "$f" ]; then echo "::error::falta $f en el repositorio (git add y push?)"; ok=0; fi
          done
          if [ -f scripts/run_pipeline.py ]; then
            grep -q "diverged" scripts/run_pipeline.py || { echo "::error::scripts/run_pipeline.py es una version antigua (sin deteccion de divergencia)"; ok=0; }
            grep -q -- "--lora_plus_ratio" scripts/run_pipeline.py || { echo "::error::scripts/run_pipeline.py es una version antigua (sin --lora_plus_ratio)"; ok=0; }
          fi
          [ "$ok" = 1 ] || exit 1
          echo "preflight OK"
      - name: Build matrix
        id: plan
        env:
          IN_POOL: ${{ inputs.pool }}
          IN_REFS: ${{ inputs.refs }}
          IN_SEED: ${{ inputs.seed }}
          IN_BASELINE_SEEDS: ${{ inputs.baseline_seeds }}
          IN_MAX_STEPS: ${{ inputs.max_steps }}
        run: |
          python -m pip install --quiet numpy
          MATRIX=$(python scripts/combo.py plan --pool "$IN_POOL" --refs "$IN_REFS" --seed "$IN_SEED" \
            --baseline_seeds "$IN_BASELINE_SEEDS" --max_steps "$IN_MAX_STEPS")
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    name: ${{ matrix.label }} s${{ matrix.seed }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-centinela-v3
          restore-keys: |
            ${{ runner.os }}-hf-centinela-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Train and evaluate
        env:
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          PYTHONUNBUFFERED: "1"
          BASE_MODEL: ${{ inputs.base_model }}
          SEED: ${{ matrix.seed }}
          RUN_ARGS: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086  # RUN_ARGS is intentionally word-split
          python scripts/run_pipeline.py --base_model "$BASE_MODEL" \
            --train_file data/train.jsonl --test_file data/test.jsonl \
            --output_dir ./lora_adapter --seed "$SEED" $RUN_ARGS
      - name: Upload metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: centinela-oat-${{ matrix.slug }}-s${{ matrix.seed }}
          path: |
            lora_adapter/metrics.json
            lora_adapter/scores_final.jsonl
            lora_adapter/curve.csv
          if-no-files-found: ignore

  report:
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: centinela-oat-*
          path: results
      - name: Build report
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          IN_POOL: ${{ inputs.pool }}
          IN_REFS: ${{ inputs.refs }}
          IN_SEED: ${{ inputs.seed }}
        run: python scripts/combo.py report --dir results --pool "$IN_POOL" --refs "$IN_REFS" --seed "$IN_SEED" --plan-json "$MATRIX" --out report.md
      - uses: actions/upload-artifact@v4
        with:
          name: combo-report
          path: report.md
