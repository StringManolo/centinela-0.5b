name: Build and Release GGUF (Centinela)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID with the LoRA artifact (centinela-run-<id>)'
        required: true
        default: '41726866511'
      base_model:
        description: 'Base HuggingFace model'
        required: true
        default: 'huihui-ai/Qwen2.5-0.5B-Instruct-abliterated-v3'
      llama_version:
        description: 'llama.cpp release tag (b<digits>, e.g. b12090, or "latest")'
        required: false
        default: 'b12090'
      release_tag:
        description: 'Release tag'
        required: true
        default: 'v0.1-cybersec-abliterated'
      release_name:
        description: 'Release title'
        required: false
        default: 'Centinela 0.1 - 0.5B Cybersec Abliterated GGUF'

permissions:
  contents: write

jobs:
  build-gguf:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies (CPU torch)
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers peft accelerate sentencepiece protobuf

      - name: Download LoRA artifact from run ${{ inputs.run_id }}
        uses: actions/download-artifact@v4
        with:
          name: centinela-run-${{ inputs.run_id }}
          path: ./lora_adapter
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Verify adapter files
        run: |
          echo "Contenido del artefacto:"
          ls -la ./lora_adapter
          test -f ./lora_adapter/adapter_model.safetensors || { echo "Falta adapter_model.safetensors"; exit 1; }
          test -f ./lora_adapter/adapter_config.json || { echo "Falta adapter_config.json"; exit 1; }

      - name: Resolve llama.cpp version
        id: resolve
        env:
          LLAMA_VERSION_INPUT: ${{ inputs.llama_version }}
        run: |
          set -euo pipefail
          if [ -z "$LLAMA_VERSION_INPUT" ] || [ "$LLAMA_VERSION_INPUT" = "latest" ]; then
            # Buscar el tag b<N> más reciente con asset bin-ubuntu-x64.tar.gz
            LATEST=$(curl -sL "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=50" \
              | jq -r '.[] | select(.tag_name | test("^b[0-9]+$")) | select(.assets | map(.name) | any(test("bin-ubuntu-x64\\.tar\\.gz$"))) | .tag_name' \
              | head -1)
            if [ -z "$LATEST" ]; then
              echo "::error::No se encontró tag b<N> con bin-ubuntu-x64.tar.gz"
              curl -sL "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=5" | jq -r '.[] | "\(.tag_name): \(.assets | map(.name) | join(", "))"' || true
              exit 1
            fi
          else
            LATEST="$LLAMA_VERSION_INPUT"
          fi
          echo "llama.cpp tag: $LATEST"
          echo "LLAMA_VERSION=$LATEST" >> $GITHUB_ENV
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Restore llama.cpp prebuilt from cache
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: llama-bin
          key: llama-bin-${{ env.LLAMA_VERSION }}-ubuntu-x64-v1
          restore-keys: |
            llama-bin-${{ env.LLAMA_VERSION }}-
            llama-bin-

      - name: Download llama.cpp prebuilt
        id: download-llama
        if: steps.cache-llama.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          LLAMA_VERSION: ${{ env.LLAMA_VERSION }}
        run: |
          set -euo pipefail
          URL="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-bin-ubuntu-x64.tar.gz"
          echo "Descargando: $URL"
          mkdir -p llama-bin
          if curl -fsSL -o llama-bin.tar.gz "$URL"; then
            tar -xzf llama-bin.tar.gz -C llama-bin
            QT=$(find llama-bin -name 'llama-quantize' -type f | head -1)
            if [ -z "$QT" ]; then
              echo "llama-quantize no encontrado tras descomprimir; se intentará compilar"
              rm -rf llama-bin
              exit 1
            fi
            chmod +x "$QT"
            echo "Descarga OK: $QT"
          else
            echo "Descarga falló; se intentará compilar"
            rm -rf llama-bin
            exit 1
          fi

      - name: Fallback build llama.cpp from source
        if: steps.cache-llama.outputs.cache-hit != 'true' && steps.download-llama.outcome != 'success'
        env:
          LLAMA_VERSION: ${{ env.LLAMA_VERSION }}
        run: |
          set -euo pipefail
          echo "Compilando llama.cpp desde fuente (tag $LLAMA_VERSION)..."
          git clone --depth 1 --branch "$LLAMA_VERSION" https://github.com/ggml-org/llama.cpp.git llama-src || \
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama-src
          cd llama-src
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build build --config Release -j"$(nproc)" --target llama-quantize
          mkdir -p "${{ github.workspace }}/llama-bin"
          cp build/bin/llama-quantize "${{ github.workspace }}/llama-bin/"
          echo "Compilación OK"

      - name: Locate llama-quantize
        run: |
          set -euo pipefail
          QT=$(find llama-bin -name 'llama-quantize' -type f | head -1)
          if [ -z "$QT" ]; then
            echo "::error::llama-quantize no encontrado ni por descarga ni por compilación"
            find . -name 'llama-quantize*' || true
            exit 1
          fi
          chmod +x "$QT"
          echo "LLAMA_QUANTIZE=$(realpath "$QT")" >> $GITHUB_ENV
          "$QT" 2>&1 | head -3 || true

      - name: Clone llama.cpp source (conversion script, same tag)
        env:
          LLAMA_VERSION: ${{ env.LLAMA_VERSION }}
        run: |
          set -euo pipefail
          if [ ! -d llama-src ]; then
            git clone --depth 1 --branch "$LLAMA_VERSION" https://github.com/ggml-org/llama.cpp.git llama-src || \
              git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama-src
          fi
          pip install -r llama-src/requirements.txt
          echo "LLAMA_SRC_DIR=$(pwd)/llama-src" >> $GITHUB_ENV
          ls llama-src/convert_hf_to_gguf.py || { echo "convert_hf_to_gguf.py no encontrado"; exit 1; }

      - name: Merge LoRA with base model
        env:
          BASE_MODEL: ${{ inputs.base_model }}
          ADAPTER_PATH: ./lora_adapter
          MERGED_DIR: ./merged_model
        run: |
          python - <<'PY'
          import os, torch
          from transformers import AutoModelForCausalLM, AutoTokenizer
          from peft import PeftModel

          base_id = os.environ['BASE_MODEL']
          adapter_path = os.environ['ADAPTER_PATH']
          out_dir = os.environ['MERGED_DIR']

          print(f"Cargando modelo base {base_id} en fp16...")
          base = AutoModelForCausalLM.from_pretrained(
              base_id, torch_dtype=torch.float16, low_cpu_mem_usage=True, trust_remote_code=True
          )
          print(f"Cargando adaptador LoRA desde {adapter_path}...")
          model = PeftModel.from_pretrained(base, adapter_path)
          print("Fusionando...")
          merged = model.merge_and_unload()
          merged.save_pretrained(out_dir, safe_serialization=True)
          tok = AutoTokenizer.from_pretrained(base_id, trust_remote_code=True)
          tok.save_pretrained(out_dir)
          print(f"Modelo fusionado guardado en {out_dir}")
          PY

      - name: Patch tokenizer_config.json (extra_special_tokens list -> dict)
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("./merged_model/tokenizer_config.json")
          cfg = json.loads(p.read_text())
          est = cfg.get("extra_special_tokens")
          if isinstance(est, list):
              cfg["extra_special_tokens"] = {t: t for t in est}
              p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2))
              print(f"Parcheado: {len(est)} tokens convertidos a dict")
          elif est is None:
              print("extra_special_tokens ausente; nada que parchear")
          else:
              print("extra_special_tokens ya es dict; nada que parchear")
          from transformers import AutoTokenizer
          AutoTokenizer.from_pretrained("./merged_model", trust_remote_code=True)
          print("Tokenizer recargado OK")
          PY

      - name: Patch convert_hf_to_gguf.py (Qwen BPE fallback)
        run: |
          python - <<'PY'
          import re, pathlib
          candidates = list(pathlib.Path("llama-src/conversion").glob("qwen*.py"))
          if not candidates:
              print("No se encontró qwen.py; el conversor puede ya manejar BPE")
              raise SystemExit(0)
          p = candidates[0]
          src = p.read_text()
          pattern = re.compile(
              r'(def set_vocab\(self\):\n)(\s*)(self\._set_vocab_sentencepiece\(\))',
              re.MULTILINE
          )
          replacement = (
              r'\1'
              r'\2try:\n'
              r'\2    \3\n'
              r'\2except FileNotFoundError:\n'
              r'\2    print("WARNING: tokenizer.model missing, falling back to BPE")\n'
              r'\2    self._set_vocab_gpt2()'
          )
          new_src, n = pattern.subn(replacement, src)
          if n > 0:
              p.write_text(new_src)
              print(f"Parcheado {p} ({n} ocurrencia/s)")
          else:
              print(f"Patrón no encontrado en {p}; probablemente ya maneja el fallback")
          PY

      - name: Convert HF to GGUF (F16)
        env:
          MERGED_DIR: ./merged_model
          FINAL_NAME: centinela0.1-0.5B-Instruct-cybersec-abliterated-F16.gguf
        run: |
          cd "$LLAMA_SRC_DIR"
          python convert_hf_to_gguf.py "${{ github.workspace }}/merged_model" \
            --outfile "${{ github.workspace }}/$FINAL_NAME" \
            --outtype f16

      - name: Quantize to target formats
        run: |
          F16="${{ github.workspace }}/centinela0.1-0.5B-Instruct-cybersec-abliterated-F16.gguf"
          for Q in Q8_0 Q6_K Q5_K_M Q4_K_M Q3_K_M Q2_K; do
            echo "Cuantizando a $Q..."
            "$LLAMA_QUANTIZE" "$F16" \
              "${{ github.workspace }}/centinela0.1-0.5B-Instruct-cybersec-abliterated-${Q}.gguf" "$Q"
          done

      - name: Package LoRA adapter for release
        id: pack-lora
        run: |
          set -euo pipefail
          TARBALL="${{ github.workspace }}/centinela0.1-lora-adapter-run-${{ inputs.run_id }}.tar.gz"
          tar -czf "$TARBALL" -C ./lora_adapter .
          ls -lh "$TARBALL"
          echo "lora_tarball=$TARBALL" >> $GITHUB_OUTPUT

      - name: Verify generated files
        run: |
          echo "Archivos generados:"
          ls -lh ${{ github.workspace }}/*.gguf ${{ github.workspace }}/*.tar.gz
          for f in ${{ github.workspace }}/*.gguf; do
            [ -s "$f" ] || { echo "Archivo vacío: $f"; exit 1; }
          done
          [ -s "${{ steps.pack-lora.outputs.lora_tarball }}" ] || { echo "LoRA tarball vacío"; exit 1; }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/centinela0.1-0.5B-Instruct-cybersec-abliterated-F16.gguf
            ${{ github.workspace }}/centinela0.1-0.5B-Instruct-cybersec-abliterated-Q8_0.gguf
            ${{ github.workspace }}/centinela0.1-0.5B-Instruct-cybersec-abliterated-Q6_K.gguf
            ${{ github.workspace }}/centinela0.1-0.5B-Instruct-cybersec-abliterated-Q5_K_M.gguf
            ${{ github.workspace }}/centinela0.1-0.5B-Instruct-cybersec-abliterated-Q4_K_M.gguf
            ${{ github.workspace }}/centinela0.1-0.5B-Instruct-cybersec-abliterated-Q3_K_M.gguf
            ${{ github.workspace }}/centinela0.1-0.5B-Instruct-cybersec-abliterated-Q2_K.gguf
            ${{ steps.pack-lora.outputs.lora_tarball }}
